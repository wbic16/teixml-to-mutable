[package]
name = "teixml-to-mutable"
version = "0.2.0"
edition = "2021"
license = "MIT"
description = "Converts TEI-XML to raw phext (stage 0.1) and to Mutable OS native Caverns (stage 0.2) — the TEI-XML → Phextura migrator"
repository = "https://github.com/wbic16/teixml-to-mutable"
homepage = "https://github.com/wbic16/teixml-to-mutable"
documentation = "https://docs.rs/teixml-to-mutable"

[dependencies]
libphext = { version = "0.6.0", features = ["binary"] }
quick-xml = "0.38"
sha2 = "0.10"
memmap2 = "0.9"
rusqlite = { version = "0.32", features = ["bundled"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
rand = "0.8"

[dev-dependencies]
zip = { version = "2", default-features = false, features = ["deflate"] }
rusqlite = { version = "0.32", features = ["bundled"] }
